<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Générateur de barres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout : établi — grande scène d'aperçu à gauche, panneau de réglages à droite, empilés sur mobile */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #16202b;
  --muted: #5d6b7a;
  --line: #d5dce3;
  --accent: #0b8ef5;
  --accent-ink: #ffffff;
  --focus: #0b8ef5;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a212a; --ink: #e8edf2; --muted: #93a1b0;
    --line: #2c3642; --accent: #3aa6ff; --accent-ink: #06121e; --focus: #3aa6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a212a; --ink: #e8edf2; --muted: #93a1b0;
  --line: #2c3642; --accent: #3aa6ff; --accent-ink: #06121e; --focus: #3aa6ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 20px 40px;
  display: grid;
  gap: 20px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.5rem, 3.5vw, 2rem);
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
}
header p { margin: 0; color: var(--muted); font-size: 0.9rem; }

.grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Scène */
.stage-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.stage {
  min-height: 300px;
  display: grid;
  place-items: center;
  padding: 32px 16px;
  overflow: auto;
  transition: background-color .2s;
}
.stage canvas { display: block; max-width: 100%; height: auto; }
.stage.bg-checker {
  background-color: #ffffff;
  background-image:
    linear-gradient(45deg, #dfe4e9 25%, transparent 25%),
    linear-gradient(-45deg, #dfe4e9 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #dfe4e9 75%),
    linear-gradient(-45deg, transparent 75%, #dfe4e9 75%);
  background-size: 18px 18px;
  background-position: 0 0, 0 9px, 9px -9px, -9px 0;
}
.stage-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
}
.stage-bar .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.swatches { display: flex; gap: 8px; align-items: center; }
.swatch {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line);
  cursor: pointer; padding: 0;
}
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.dims { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Panneau */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  display: grid;
  gap: 18px;
}
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; }
legend {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  padding: 0;
  margin-bottom: 10px;
}
.sep { height: 1px; background: var(--line); }

.pct-row { display: flex; align-items: center; gap: 12px; }
.pct-row input[type="range"] { flex: 1; min-width: 0; }
.pct-num {
  display: flex; align-items: baseline; gap: 2px;
  font-family: var(--font-mono); font-size: 1.4rem; font-weight: 500;
}
.pct-num input {
  width: 3.4ch; text-align: right;
  font: inherit; color: var(--ink);
  background: transparent; border: 0; border-bottom: 1.5px solid var(--line);
  padding: 0;
  font-variant-numeric: tabular-nums;
}
.pct-num input::-webkit-inner-spin-button { display: none; }
.pct-num span { color: var(--muted); font-size: 1rem; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button {
  font-family: var(--font-mono); font-size: 0.8rem;
  background: transparent; color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; cursor: pointer;
}
.presets button:hover { border-color: var(--accent); color: var(--accent); }

input[type="range"] { accent-color: var(--accent); }

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 0.82rem; color: var(--muted); }
.field input[type="number"], .field select {
  width: 100%;
  font-family: var(--font-mono); font-size: 0.9rem;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px;
  font-variant-numeric: tabular-nums;
}
.color-field { display: flex; align-items: center; gap: 8px; }
.color-field input[type="color"] {
  width: 34px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
  background: none; cursor: pointer; flex: none;
}
.color-field input[type="text"] {
  width: 100%; min-width: 0;
  font-family: var(--font-mono); font-size: 0.85rem; text-transform: uppercase;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px;
}
.check { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.dl {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  font-family: var(--font-display); font-weight: 700; font-size: 1rem;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 10px;
  padding: 12px 16px; cursor: pointer;
}
.dl:hover { filter: brightness(1.06); }
.dl:disabled { opacity: .5; cursor: not-allowed; }
.status { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; margin: 0; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Générateur de barres</h1>
    <p>Barre de progression sans texte, exportée en PNG transparent.</p>
  </header>

  <div class="grid">
    <section class="stage-card" aria-label="Aperçu">
      <div class="stage" id="stage" style="background-color:#3fb79f">
        <canvas id="preview" aria-label="Aperçu de la barre de progression"></canvas>
      </div>
      <div class="stage-bar">
        <div class="swatches" role="group" aria-label="Fond de l'aperçu">
          <span class="label">Fond d'aperçu</span>
          <button class="swatch" type="button" data-bg="#3fb79f" style="background:#3fb79f" aria-pressed="true" title="Vert d'eau"></button>
          <button class="swatch" type="button" data-bg="checker" style="background:conic-gradient(#dfe4e9 25%,#fff 0 50%,#dfe4e9 0 75%,#fff 0) 0 0/10px 10px" aria-pressed="false" title="Transparent"></button>
          <button class="swatch" type="button" data-bg="#ffffff" style="background:#ffffff" aria-pressed="false" title="Blanc"></button>
          <button class="swatch" type="button" data-bg="#1b2129" style="background:#1b2129" aria-pressed="false" title="Sombre"></button>
        </div>
        <span class="dims" id="dims"></span>
      </div>
    </section>

    <form class="panel" id="form" autocomplete="off">
      <fieldset>
        <legend>Pourcentage</legend>
        <div class="pct-row">
          <input type="range" id="pct" min="0" max="100" step="1" value="75" aria-label="Pourcentage">
          <div class="pct-num">
            <input type="number" id="pctNum" min="0" max="100" step="1" value="75" aria-label="Pourcentage (valeur)">
            <span>%</span>
          </div>
        </div>
        <div class="presets" id="presets">
          <button type="button" data-v="0">0</button>
          <button type="button" data-v="25">25</button>
          <button type="button" data-v="50">50</button>
          <button type="button" data-v="75">75</button>
          <button type="button" data-v="100">100</button>
        </div>
      </fieldset>

      <div class="sep"></div>

      <fieldset>
        <legend>Couleurs</legend>
        <div class="fields">
          <div class="field">
            <label for="cFillT">Remplissage</label>
            <div class="color-field"><input type="color" id="cFill" value="#0b8ef5" aria-label="Couleur de remplissage"><input type="text" id="cFillT" value="#0B8EF5" maxlength="7"></div>
          </div>
          <div class="field">
            <label for="cTrackT">Fond de la barre</label>
            <div class="color-field"><input type="color" id="cTrack" value="#dedede" aria-label="Couleur du fond de la barre"><input type="text" id="cTrackT" value="#DEDEDE" maxlength="7"></div>
          </div>
          <div class="field">
            <label for="cBorderT">Contour</label>
            <div class="color-field"><input type="color" id="cBorder" value="#ffffff" aria-label="Couleur du contour"><input type="text" id="cBorderT" value="#FFFFFF" maxlength="7"></div>
          </div>
          <div class="field">
            <label for="cBgT">Fond de l'image</label>
            <div class="color-field"><input type="color" id="cBg" value="#3fb79f" aria-label="Couleur du fond de l'image"><input type="text" id="cBgT" value="#3FB79F" maxlength="7"></div>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="transparent" checked> Fond transparent dans l'image</label>
      </fieldset>

      <div class="sep"></div>

      <fieldset>
        <legend>Forme</legend>
        <div class="fields">
          <div class="field"><label for="w">Largeur (px)</label><input type="number" id="w" min="20" max="2000" value="180"></div>
          <div class="field"><label for="h">Hauteur (px)</label><input type="number" id="h" min="2" max="400" value="18"></div>
          <div class="field"><label for="r">Arrondi (px)</label><input type="number" id="r" min="0" max="200" value="9"></div>
          <div class="field"><label for="b">Épaisseur contour (px)</label><input type="number" id="b" min="0" max="40" step="0.5" value="1.5"></div>
          <div class="field"><label for="pad">Marge intérieure (px)</label><input type="number" id="pad" min="0" max="40" step="0.5" value="0"></div>
          <div class="field">
            <label for="scale">Résolution</label>
            <select id="scale">
              <option value="1">×1</option>
              <option value="2">×2</option>
              <option value="4" selected>×4 (net)</option>
              <option value="8">×8</option>
            </select>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="pill" checked> Arrondi maximal (forme pilule)</label>
      </fieldset>

      <button class="dl" type="submit" id="dl">Télécharger le PNG</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const cv = $("preview");
  const stage = $("stage");
  const statusEl = $("status");
  const isHex = (s) => /^#[0-9a-f]{6}$/i.test(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const num = (id, d) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : d; };

  function state() {
    const h = clamp(num("h", 18), 2, 400);
    return {
      pct: clamp(Math.round(num("pctNum", 75)), 0, 100),
      w: clamp(num("w", 180), 20, 2000),
      h,
      r: $("pill").checked ? h / 2 : clamp(num("r", 9), 0, h / 2),
      b: clamp(num("b", 1.5), 0, 40),
      pad: clamp(num("pad", 0), 0, h / 2 - 0.5),
      scale: parseInt($("scale").value, 10) || 1,
      fill: $("cFill").value, track: $("cTrack").value,
      border: $("cBorder").value, bg: $("cBg").value,
      transparent: $("transparent").checked
    };
  }

  function rr(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Dessine la barre ; renvoie un canvas à la taille d'export
  function render(canvas, s, scale) {
    const outW = s.w + 2 * s.b, outH = s.h + 2 * s.b;
    canvas.width = Math.round(outW * scale);
    canvas.height = Math.round(outH * scale);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, outW, outH);
    if (!s.transparent) { ctx.fillStyle = s.bg; ctx.fillRect(0, 0, outW, outH); }

    // contour
    if (s.b > 0) { ctx.fillStyle = s.border; rr(ctx, 0, 0, outW, outH, s.r + s.b); ctx.fill(); }
    // piste
    ctx.fillStyle = s.track; rr(ctx, s.b, s.b, s.w, s.h, s.r); ctx.fill();
    // remplissage, découpé dans la piste
    const ix = s.b + s.pad, iy = s.b + s.pad, iw = s.w - 2 * s.pad, ih = s.h - 2 * s.pad;
    const ir = Math.max(0, s.r - s.pad);
    const fw = iw * s.pct / 100;
    if (fw > 0) {
      ctx.save();
      rr(ctx, ix, iy, iw, ih, ir); ctx.clip();
      ctx.fillStyle = s.fill;
      rr(ctx, ix, iy, fw, ih, ir); ctx.fill();
      ctx.restore();
    }
    return { outW, outH };
  }

  function draw() {
    const s = state();
    // aperçu agrandi pour être lisible, rendu net sur écran haute densité
    const zoom = s.w + 2 * s.b < 300 ? 2 : 1;
    const dpr = window.devicePixelRatio || 1;
    const { outW, outH } = render(cv, s, zoom * dpr);
    cv.style.width = outW * zoom + "px";
    cv.style.aspectRatio = outW + " / " + outH;
    $("dims").textContent =
      `PNG ${Math.round(outW * s.scale)} × ${Math.round(outH * s.scale)} px` + (zoom > 1 ? " · aperçu ×2" : "");
    try { localStorage.setItem("barres-gen", JSON.stringify(collect())); } catch (e) {}
  }

  // synchro pourcentage
  function setPct(v) {
    v = clamp(Math.round(v), 0, 100);
    $("pct").value = v; $("pctNum").value = v; draw();
  }
  $("pct").addEventListener("input", (e) => { $("pctNum").value = e.target.value; draw(); });
  $("pctNum").addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    if (Number.isFinite(v)) { $("pct").value = clamp(v, 0, 100); draw(); }
  });
  $("pctNum").addEventListener("change", (e) => setPct(parseFloat(e.target.value) || 0));
  $("presets").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setPct(+b.dataset.v); });

  // synchro couleurs
  [["cFill", "cFillT"], ["cTrack", "cTrackT"], ["cBorder", "cBorderT"], ["cBg", "cBgT"]].forEach(([c, t]) => {
    $(c).addEventListener("input", () => { $(t).value = $(c).value.toUpperCase(); draw(); });
    $(t).addEventListener("input", () => {
      let v = $(t).value.trim(); if (v && v[0] !== "#") v = "#" + v;
      if (isHex(v)) { $(c).value = v.toLowerCase(); draw(); }
    });
    $(t).addEventListener("change", () => { $(t).value = $(c).value.toUpperCase(); });
  });

  ["w", "h", "r", "b", "pad", "scale", "transparent"].forEach((id) => $(id).addEventListener("input", draw));
  $("pill").addEventListener("change", () => { $("r").disabled = $("pill").checked; draw(); });

  // fond de l'aperçu
  document.querySelectorAll(".swatch").forEach((btn) => btn.addEventListener("click", () => {
    document.querySelectorAll(".swatch").forEach((b) => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    const v = btn.dataset.bg;
    if (v === "checker") { stage.classList.add("bg-checker"); stage.style.backgroundColor = ""; }
    else { stage.classList.remove("bg-checker"); stage.style.backgroundColor = v; }
  }));

  // mémoriser les réglages (confort uniquement)
  const ids = ["pctNum", "w", "h", "r", "b", "pad", "scale", "cFill", "cTrack", "cBorder", "cBg"];
  const checks = ["transparent", "pill"];
  function collect() {
    const o = {}; ids.forEach((i) => o[i] = $(i).value); checks.forEach((i) => o[i] = $(i).checked); return o;
  }
  try {
    const saved = JSON.parse(localStorage.getItem("barres-gen") || "null");
    if (saved) {
      ids.forEach((i) => { if (saved[i] != null) $(i).value = saved[i]; });
      checks.forEach((i) => { if (typeof saved[i] === "boolean") $(i).checked = saved[i]; });
      $("pct").value = $("pctNum").value;
      ["cFill", "cTrack", "cBorder", "cBg"].forEach((c) => $(c + "T").value = $(c).value.toUpperCase());
    }
  } catch (e) {}
  $("r").disabled = $("pill").checked;

  // téléchargement
  let downloads = null;
  const inViewer = !!window.claude;
  if (inViewer && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => {
      downloads = d;
      if (!d) { $("dl").disabled = true; statusEl.textContent = "Le téléchargement n'est pas disponible dans cette vue."; }
    }).catch(() => {});
  }

  function toBlob(canvas) {
    return new Promise((res, rej) => canvas.toBlob((b) => b ? res(b) : rej(new Error("png")), "image/png"));
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const s = state();
    const out = document.createElement("canvas");
    render(out, s, s.scale);
    const filename = `barre-${s.pct}.png`;
    statusEl.textContent = "";
    try {
      const blob = await toBlob(out);
      if (downloads) {
        await downloads.save({ filename, data: blob });
        statusEl.textContent = `${filename} enregistré.`;
      } else if (!inViewer) {
        // page ouverte hors de claude.ai : lien de téléchargement classique
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        statusEl.textContent = `${filename} téléchargé.`;
      } else {
        statusEl.textContent = "Patiente une seconde, le téléchargement se prépare, puis réessaie.";
      }
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") statusEl.textContent = "Téléchargement annulé.";
      else if (code === "rate_limited") statusEl.textContent = "Une demande est déjà ouverte, réessaie dans un instant.";
      else statusEl.textContent = "Le téléchargement a échoué. Réessaie.";
    }
  });

  draw();
  window.addEventListener("resize", draw);
})();
</script>

</body></html>
